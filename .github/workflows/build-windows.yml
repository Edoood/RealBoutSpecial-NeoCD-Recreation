name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Microsoft C++ compiler
        shell: cmd
        run: call scripts\build-msvc.cmd
      - name: Package launcher binary for review
        shell: pwsh
        run: |
          Compress-Archive -Path build/RealBoutLauncher.exe -DestinationPath RealBoutLauncher-windows-x64.zip -Force
      - name: Upload test artifact (launcher only, not a playable game)
        uses: actions/upload-artifact@v4
        with:
          name: RealBoutLauncher-windows-x64
          path: RealBoutLauncher-windows-x64.zip
          if-no-files-found: error
