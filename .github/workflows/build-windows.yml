name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Microsoft C++ compiler
        shell: cmd
        run: call scripts\build-msvc.cmd
      - name: Package launcher without ROM/BIOS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/Support | Out-Null
          Copy-Item build/RealBoutLauncher.exe staging/
          Copy-Item assets/banner.bmp staging/Support/
          Compress-Archive -Path staging/* -DestinationPath RealBoutLauncher-windows-x64.zip -Force
      - name: Upload build artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: RealBoutLauncher-windows-x64
          path: RealBoutLauncher-windows-x64.zip
          if-no-files-found: error